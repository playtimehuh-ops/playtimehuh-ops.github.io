<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB: LOCKDOWN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: monospace;
            color: #e0e0e0;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-panel {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #333;
            padding: 12px 18px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.6);
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }
        #jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(200, 0, 0, 0.92) 0%, rgba(5, 0, 0, 0.99) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.02s ease-in-out;
            z-index: 9999;
        }
        @keyframes screen-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-25px, 20px) rotate(-5deg); }
            30% { transform: translate(25px, -20px) rotate(5deg); }
            45% { transform: translate(-20px, -25px) rotate(-3deg); }
            60% { transform: translate(20px, 25px) rotate(4deg); }
            75% { transform: translate(-15px, 15px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .jumpscare-active {
            animation: screen-shake 0.4s ease-in-out infinite;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10000;
        }
        #game-over-screen h1 {
            color: #ff3333;
            font-size: 3rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .btn {
            background: #111;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            font-family: monospace;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #333;
            border-color: #888;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="jumpscare-overlay"></div>
    
    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between;">
            <div class="hud-panel" id="objective-hud">OBJECTIVE: LOCATE SECURITY KEYCARD</div>
            <div class="hud-panel" id="status-hud">HEALTH: 100 | BATTERY: 100%</div>
        </div>
        <div class="hud-panel" style="align-self: center;">CONTROLS: WASD TO MOVE | MOUSE TO LOOK | SHIFT TO RUN | SPACE TO JUMP</div>
    </div>

    <div id="game-over-screen">
        <h1>SUBJECT TERMINATED</h1>
        <p style="color: #888; letter-spacing: 1px;">THE ENTITY CAUGHT YOU IN THE FACILITY.</p>
        <button class="btn" onclick="location.reload()">RELOAD SECTOR</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, audioCtx;
        let player = {
            position: new THREE.Vector3(0, 1.6, 5),
            velocity: new THREE.Vector3(),
            speed: 0.08,
            isDead: false
        };
        let keys = {};
        let monster;
        let flashlight;
        let clock = new THREE.Clock();

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.06);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x111115, 0.4);
            scene.add(ambientLight);

            flashlight = new THREE.SpotLight(0xfff5e6, 2.5, 25, Math.PI / 6, 0.5, 1);
            flashlight.position.copy(camera.position);
            scene.add(flashlight);
            scene.add(flashlight.target);

            buildFacility();
            createMonster();
            setupAudio();
            setupInputs();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildFacility() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.9 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.8 });

            const floorGeo = new THREE.PlaneGeometry(10, 80);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0, -30);
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeo, wallMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, 4, -30);
            scene.add(ceiling);

            const wallGeo = new THREE.BoxGeometry(1, 4, 80);
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-5, 2, -30);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(5, 2, -30);
            scene.add(rightWall);
        }

        function createMonster() {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f0f0f, roughness: 0.5, metalness: 0.2 });
            const coreGeo = new THREE.BoxGeometry(0.8, 2.2, 0.6);
            const core = new THREE.Mesh(coreGeo, bodyMat);
            core.position.y = 1.1;
            group.add(core);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.08, 0.1);
            
            const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
            eye1.position.set(-0.2, 1.8, -0.31);
            group.add(eye1);

            const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
            eye2.position.set(0.2, 1.8, -0.31);
            group.add(eye2);

            group.position.set(0, 0, -25);
            group.userData = { speed: 0.055 };
            scene.add(group);
            monster = group;
        }

        function setupAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
            }
        }

        function playJumpscareAudio() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.3);

            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.4);
        }

        let pitchYaw = { x: 0, y: 0 };
        function setupInputs() {
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== document.body || player.isDead) return;
                const sensitivity = 0.002;
                pitchYaw.y -= e.movementX * sensitivity;
                pitchYaw.x -= e.movementY * sensitivity;
                pitchYaw.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchYaw.x));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = pitchYaw.y;
                camera.rotation.x = pitchYaw.x;
            });
        }

        function updatePlayer(delta) {
            if (player.isDead) return;

            let moveSpeed = player.speed;
            if (keys['ShiftLeft'] || keys['ShiftRight']) moveSpeed *= 1.6;

            let dir = new THREE.Vector3();
            if (keys['KeyW'] || keys['ArrowUp']) dir.z -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dir.z += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dir.x -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), pitchYaw.y);

            player.position.addScaledVector(dir, moveSpeed);
            player.position.x = Math.max(-4.2, Math.min(4.2, player.position.x));
            player.position.z = Math.max(-75, Math.min(10, player.position.z));

            camera.position.copy(player.position);

            flashlight.position.copy(camera.position);
            const targetDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), pitchYaw.y);
            flashlight.target.position.copy(camera.position).add(targetDir.multiplyScalar(10));
            flashlight.target.updateMatrixWorld();
        }

        function updateMonster(delta) {
            if (player.isDead) return;

            const direction = new THREE.Vector3().subVectors(player.position, monster.position);
            direction.y = 0;
            const distance = direction.length();

            // Increase speed dynamically as it gets closer for an intense chase
            if (distance < 12) {
                monster.userData.speed = 0.09;
            } else {
                monster.userData.speed = 0.055;
            }

            if (distance > 0.4) {
                direction.normalize();
                monster.position.addScaledVector(direction, monster.userData.speed);
                monster.lookAt(player.position.x, monster.position.y, player.position.z);
            }

            // Trigger jumpscare instantly on contact threshold
            if (distance < 1.8) {
                triggerJumpscare();
            }
        }

        function triggerJumpscare() {
            if (player.isDead) return;
            player.isDead = true;

            camera.lookAt(monster.position);

            const overlay = document.getElementById('jumpscare-overlay');
            if (overlay) {
                overlay.style.opacity = '1';
                document.body.classList.add('jumpscare-active');
            }

            playJumpscareAudio();

            document.exitPointerLock();
            setTimeout(() => {
                document.body.classList.remove('jumpscare-active');
                document.getElementById('game-over-screen').style.display = 'flex';
            }, 1400);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updatePlayer(delta);
            updateMonster(delta);

            renderer.render(scene, camera);
        }

        window.onload = init;

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
